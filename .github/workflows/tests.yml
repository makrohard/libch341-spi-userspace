name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake libusb-1.0-0-dev pkg-config

      - name: Build the library and test.c (the upstream CMake project)
        run: |
          cmake -S . -B build
          cmake --build build --parallel 2

      - name: Fake-libusb tests
        run: sh tests/run.sh
